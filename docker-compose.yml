services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nekopass}
      POSTGRES_USER: ${POSTGRES_USER:-nekopass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  panel:
    build:
      context: .
      dockerfile: Dockerfile
    image: nekopass:local-v0.19.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NEKOPASS_DATABASE_URL: postgres://${POSTGRES_USER:-nekopass}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nekopass}?sslmode=disable
      NEKOPASS_TRUSTED_PROXIES: ${NEKOPASS_TRUSTED_PROXIES:-}
      NEKOPASS_PANEL_UPDATE_DIR: /var/lib/nekopass
    ports:
      - "${NEKOPASS_HTTP_BIND:-8080}:8080"
      - "${NEKOPASS_GRPC_BIND:-9443}:9443"
    volumes:
      - panel_data:/var/lib/nekopass
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # Optional: run one agent per forwarding host.
  # It uses host networking because forwarding rules may bind host ports.
  agent:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: nekopass-agent:local-v0.19.0
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
      - NET_RAW
    environment:
      NEKOPASS_SERVER: ${NEKOPASS_SERVER:-}
      NEKOPASS_NODE_TOKEN: ${NEKOPASS_NODE_TOKEN:-}
    volumes:
      - agent_state:/var/lib/nekopass-agent

volumes:
  postgres_data:
  panel_data:
  agent_state:
